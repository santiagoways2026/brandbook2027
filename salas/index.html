<title>Salas del Camino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: portada = planta del edificio vista desde arriba, cada sala con su equipo moviéndose en vivo; al entrar en una sala se abre su ficha con datos, métricas y listado. */
:root{
  --piedra:#eef0f2;      /* granito claro, fondo */
  --losa:#ffffff;        /* superficies */
  --tinta:#16233a;       /* texto principal, azul de señal oscurecido */
  --tinta-2:#55617a;     /* texto secundario */
  --linea:#d6dbe3;
  --vieira:#1f4fa0;      /* azul de los mojones */
  --flecha:#f4c21a;      /* amarillo flecha */
  --flecha-tinta:#3a2c00;
  --ok:#1f8a5b; --aviso:#b86e00; --alto:#c2362b;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
  --barra:#16233a;
  --suelo:#e4e8ee; --baldosa:#d8dee7; --pared:#16233a; --mesa:#cdb791; --mesa-borde:#a88f63; --silla:#5d6a83; --pantalla:#0f1522; --planta:#3f8a5a;
  --obra:#ece6d6; --obra-baldosa:#e0d8c3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --piedra:#0f1522;--losa:#172033;--tinta:#e7ecf5;--tinta-2:#9aa7bf;--linea:#28344b;
  --vieira:#7fa6ee;--flecha:#f4c21a;--flecha-tinta:#2a2000;--ok:#4cc58e;--aviso:#f0a53a;--alto:#ff7a6e;--barra:#0a0f19;--suelo:#1b2437;--baldosa:#222d43;--pared:#3b4964;--mesa:#6e5c3f;--mesa-borde:#8c7550;--silla:#46536d;--pantalla:#060a12;--planta:#3f8a5a;--obra:#2a2620;--obra-baldosa:#332e26;color-scheme:dark}}
:root[data-theme="dark"]{
  --piedra:#0f1522;--losa:#172033;--tinta:#e7ecf5;--tinta-2:#9aa7bf;--linea:#28344b;
  --vieira:#7fa6ee;--flecha:#f4c21a;--flecha-tinta:#2a2000;--ok:#4cc58e;--aviso:#f0a53a;--alto:#ff7a6e;--barra:#0a0f19;--suelo:#1b2437;--baldosa:#222d43;--pared:#3b4964;--mesa:#6e5c3f;--mesa-borde:#8c7550;--silla:#46536d;--pantalla:#060a12;--planta:#3f8a5a;--obra:#2a2620;--obra-baldosa:#332e26;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--piedra);color:var(--tinta);font:15px/1.5 var(--f-body)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vieira);outline-offset:2px}

/* Barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px;padding-inline:clamp(16px,3.5vw,44px);background:var(--barra);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.marca{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:#fff;text-align:left}
.marca b{font:800 19px/1 var(--f-display);font-stretch:118%;letter-spacing:.01em;text-transform:uppercase}
.marca small{display:block;font:500 11px/1.3 var(--f-mono);color:#aab6cc;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.top-estado{font:12px/1.4 var(--f-mono);color:#aab6cc;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.vivo{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ok)}
.vivo::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:latido 2s ease-in-out infinite}
.vivo.off{color:#8d9ab3}.vivo.off::before{animation:none}
@keyframes latido{50%{opacity:.25}}

/* Edificio */
.edificio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sala-card{background:var(--losa);border:1px solid var(--linea);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0;transition:border-color .15s,transform .15s}
.sala-card:hover{border-color:var(--tinta-2);transform:translateY(-2px)}
.sala-card.grande{grid-column:1/-1}
.plano{position:relative;aspect-ratio:2/1;background:var(--suelo);overflow:hidden}
.plano svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sala-pie{display:flex;justify-content:space-between;gap:10px 16px;padding:14px 16px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--linea)}
.sala-pie h2{margin:4px 0 2px;font:800 22px/1.05 var(--f-display);font-stretch:112%}
.sala-pie .sub{font-size:13px;color:var(--tinta-2)}
.sala-pie .datos{display:flex;gap:18px;flex-wrap:wrap;font:12px/1.3 var(--f-mono);color:var(--tinta-2)}
.sala-pie .datos b{display:block;font:750 20px/1.1 var(--f-display);color:var(--tinta);font-variant-numeric:tabular-nums}
.entrar{font:600 13px/1 var(--f-body);background:var(--flecha);color:var(--flecha-tinta);border-radius:8px;padding:9px 12px;white-space:nowrap}
.entrar.gris{background:var(--linea);color:var(--tinta-2)}
.ticker{font-size:13px;color:var(--tinta-2);padding:0 16px 14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ticker b{color:var(--tinta);font-weight:600}
.bocadillo{position:absolute;transform:translate(-50%,calc(-100% - 14px));background:var(--losa);color:var(--tinta);border:1px solid var(--linea);padding:6px 9px;border-radius:10px;font-size:12px;line-height:1.3;width:max-content;max-width:min(230px,40%);box-shadow:0 6px 16px rgba(10,20,40,.18);pointer-events:none;z-index:2;animation:aparece .25s ease-out}
.bocadillo::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:inherit;border-right:1px solid var(--linea);border-bottom:1px solid var(--linea);transform:translateX(-50%) rotate(45deg)}
.bocadillo b{display:block;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-2);margin-bottom:2px}
@keyframes aparece{from{opacity:0;transform:translate(-50%,calc(-100% - 6px))}}
.glow{animation:tecleo 1.6s steps(3) infinite}
@keyframes tecleo{50%{opacity:.55}}
.barrido{transform-origin:0 0;animation:gira 3s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.grua{animation:grua 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 50%}
@keyframes grua{to{transform:rotate(-14deg)}}
@media (prefers-reduced-motion: reduce){.vivo::before,.glow,.barrido,.grua,.bocadillo{animation:none}.sala-card:hover{transform:none}}
.volver{align-self:flex-start;background:none;border:1px solid var(--linea);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13.5px;color:var(--tinta-2)}
.volver:hover{color:var(--tinta);border-color:var(--tinta-2)}
.intro h1{margin-top:6px}

/* Plano: textos SVG */
.nombre{font:600 13px var(--f-mono);fill:var(--tinta);paint-order:stroke;stroke:var(--suelo);stroke-width:4px;stroke-linejoin:round}
.pant-t{font:700 11px var(--f-mono);fill:#8fe3b0;letter-spacing:.12em}
.pant-n{font:600 12px var(--f-mono);fill:#f4c21a}
.cartel{font:850 27px var(--f-display);font-stretch:112%;fill:#1d1d1d;letter-spacing:.04em}
.obrero{animation:obrero 9s ease-in-out infinite alternate}
@keyframes obrero{to{transform:translateX(150px)}}
@media (prefers-reduced-motion: reduce){.obrero{animation:none}}
.bocadillo.abajo{transform:translate(-50%,22px);animation:none}
.bocadillo.abajo::after{top:-6px;bottom:auto;transform:translateX(-50%) rotate(225deg)}
.intro p{margin:0;color:var(--tinta-2);max-width:62ch}

/* Métricas */
.metricas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.met{display:grid;min-width:84px;padding:7px 10px;border-radius:8px;background:var(--piedra);border:1px solid var(--linea)}
.met b{font:750 17px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.met span{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-2)}
.met.eng{background:color-mix(in srgb,var(--flecha) 22%,var(--losa));border-color:color-mix(in srgb,var(--flecha) 60%,var(--linea))}
.met-fuente{font:11.5px/1.3 var(--f-mono);color:var(--tinta-2)}
.podio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ganador{background:var(--losa);border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ganador .pos{font:800 13px/1 var(--f-mono);color:var(--tinta-2);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ganador .total{font:850 30px/1 var(--f-display);font-stretch:105%;font-variant-numeric:tabular-nums}
.ganador .total small{font:500 11px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--tinta-2);display:block;margin-top:4px}
.ganador a{font-weight:600;line-height:1.3;text-decoration:none}
.ganador a:hover{text-decoration:underline}
.ganador .desg{font:12px/1.5 var(--f-mono);color:var(--tinta-2)}

/* Sala */
main{padding-block:28px 60px;padding-inline:clamp(16px,3.5vw,44px);min-width:0;display:flex;flex-direction:column;gap:26px}
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tinta-2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font:850 clamp(30px,4.6vw,50px)/.98 var(--f-display);font-stretch:112%;letter-spacing:-.01em;margin:10px 0 8px;text-wrap:balance}
.cab p{margin:0;color:var(--tinta-2);max-width:62ch}
.mojon{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:132px;padding:12px 16px;background:var(--vieira);color:#fff;border-radius:8px 8px 3px 3px;font-family:var(--f-mono);text-align:center}
.mojon .k{font:800 34px/1 var(--f-display);font-stretch:100%;font-variant-numeric:tabular-nums;color:var(--flecha)}
.mojon span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}

/* Resumen */
.resumen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:var(--r);overflow:hidden}
.dato{background:var(--losa);padding:14px 16px;min-width:0}
.dato .v{font:750 24px/1.1 var(--f-display);font-stretch:105%;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.dato .l{font:500 11.5px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2);margin-top:4px}

/* Equipo */
.bloque h3{font:750 13px/1 var(--f-display);font-stretch:118%;text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.bloque h3 .c{font:500 12px/1 var(--f-mono);color:var(--tinta-2);text-transform:none;letter-spacing:0}
.equipo{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.agente{background:var(--losa);border:1px solid var(--linea);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 12px;align-items:start}
.avatar{grid-row:span 3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-mono);color:#fff}
.agente .nom{font-weight:600;font-size:14px;line-height:1.25}
.agente .rol{font-size:12.5px;color:var(--tinta-2);line-height:1.35}
.agente .act{font:12px/1.35 var(--f-mono);color:var(--tinta-2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* Filtros */
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5;background:var(--piedra);padding-block:10px;margin-block:-10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--linea);background:var(--losa);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--tinta);color:var(--piedra);border-color:var(--tinta)}
.chip .cnt{font:12px/1 var(--f-mono);opacity:.7}
.buscar{flex:1 1 200px;min-width:0;border:1px solid var(--linea);background:var(--losa);border-radius:8px;padding:8px 12px}
select{border:1px solid var(--linea);background:var(--losa);border-radius:8px;padding:8px 10px}
.btn{border:1px solid var(--linea);background:var(--losa);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--tinta-2)}
.btn.prim{background:var(--flecha);border-color:var(--flecha);color:var(--flecha-tinta)}

/* Listado */
.dos{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{background:var(--losa);border:1px solid var(--linea);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:58px minmax(0,1fr);gap:14px}
.item.nuevo{border-color:color-mix(in srgb,var(--flecha) 70%,var(--linea))}
.buzz{display:flex;flex-direction:column;align-items:center;gap:6px}
.buzz .num{font:800 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.buzz .barra{width:8px;height:44px;border-radius:4px;background:var(--linea);position:relative;overflow:hidden}
.buzz .barra i{position:absolute;inset:auto 0 0 0;border-radius:4px}
.buzz small{font:10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:12px/1.3 var(--f-mono);color:var(--tinta-2)}
.plat{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:5px;color:#fff}
.pill{display:inline-flex;font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px;background:var(--flecha);color:var(--flecha-tinta)}
.pill.gris{background:var(--linea);color:var(--tinta-2)}
.item h4{margin:6px 0 4px;font:650 17px/1.3 var(--f-body);text-wrap:balance}
.item h4 a{text-decoration:none}
.item h4 a:hover{text-decoration:underline;text-decoration-color:var(--flecha);text-decoration-thickness:2px;text-underline-offset:3px}
.item p{margin:0 0 6px;color:var(--tinta);max-width:75ch}
.porque{font-size:13.5px;color:var(--tinta-2);border-left:3px solid var(--flecha);padding-left:10px;margin:8px 0}
.senales{font:12.5px/1.4 var(--f-mono);color:var(--tinta)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font:12px/1 var(--f-mono);color:var(--tinta-2);background:var(--piedra);padding:4px 7px;border-radius:5px}
.acciones{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acciones .btn{padding:5px 10px;font-size:12.5px}
.btn[aria-pressed="true"]{background:var(--tinta);color:var(--piedra);border-color:var(--tinta)}

.vacio{background:var(--losa);border:1px dashed var(--linea);border-radius:var(--r);padding:28px;color:var(--tinta-2)}
.vacio b{color:var(--tinta);display:block;font:700 18px/1.3 var(--f-display);margin-bottom:6px}

/* Bitácora */
.bitacora{background:var(--losa);border:1px solid var(--linea);border-radius:var(--r);padding:16px;position:sticky;top:76px}
.bitacora ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto}
.bitacora li{font-size:13px;line-height:1.4;display:grid;gap:2px}
.bitacora time{font:11.5px/1 var(--f-mono);color:var(--tinta-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--piedra);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:20}

.proxima{display:grid;gap:14px;max-width:640px}

@media (max-width:1080px){.dos{grid-template-columns:minmax(0,1fr)}.bitacora{position:static}.resumen{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.podio{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .edificio{grid-template-columns:minmax(0,1fr)}
  .bocadillo{font-size:11px;max-width:55%}
  .item{grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px}
  .mojon{min-width:0;flex-direction:row;gap:8px;padding:8px 12px}
  .mojon .k{font-size:24px}
  .filtros{position:static;margin-block:0;padding-block:0}
}
</style>

<header class="top">
  <button class="marca" id="irEdificio" aria-label="Ver el edificio">
    <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#1f4fa0"/><g fill="none" stroke="#f4c21a" stroke-width="2.2" stroke-linecap="round"><path d="M20 31 L8 15"/><path d="M20 31 L12.5 11.5"/><path d="M20 31 L20 9.5"/><path d="M20 31 L27.5 11.5"/><path d="M20 31 L32 15"/></g></svg>
    <div><b>Salas</b><small>del Camino</small></div>
  </button>
  <div class="top-estado" id="pieEstado">Conectando con el edificio…</div>
</header>
<main id="sala"></main>
<div class="toast" id="toast" hidden></div>

<script>
const SALAS=[
  {id:"radar",nombre:"Radar Viral",desc:"Seis especialistas rastrean lo que más circula sobre el Camino de Santiago",activa:true},
  {id:"redaccion",nombre:"Redacción",desc:"Convertirá las tendencias del Radar en publicaciones listas para tus redes",activa:false},
  {id:"analisis",nombre:"Análisis",desc:"Medirá el rendimiento de tus propias redes y lo comparará con lo viral",activa:false},
];
const PLAT={
  instagram:{n:"Instagram",c:"#c13584"},tiktok:{n:"TikTok",c:"#111111"},youtube:{n:"YouTube",c:"#d62a1e"},
  facebook:{n:"Facebook",c:"#1b62d6"},x:{n:"X",c:"#3c4656"},reddit:{n:"Reddit",c:"#e2531c"},
  blog:{n:"Blog",c:"#2f7d5b"},prensa:{n:"Prensa",c:"#6b4fb0"},foro:{n:"Foro",c:"#8a6a1e"}
};
const EQUIPO=[
  {id:"insta",n:"Lucía",rol:"Rastreadora de Instagram y TikTok: reels, hashtags y creadores",c:"#c13584"},
  {id:"yt",n:"Mateo",rol:"Analista de YouTube: vídeos con tracción reciente",c:"#d62a1e"},
  {id:"fb",n:"Carmen",rol:"Observadora de Facebook y grupos de peregrinos",c:"#1b62d6"},
  {id:"prensa",n:"Andrés",rol:"Vigía de prensa: noticias que generan conversación",c:"#6b4fb0"},
  {id:"blogs",n:"Inés",rol:"Sabueso de blogs, Reddit y foros",c:"#2f7d5b"},
  {id:"jefa",n:"Marta",rol:"Jefa de sala: puntúa el buzz y depura duplicados",c:"#1f4fa0"},
];

const st={sala:null,items:[],estado:null,plat:"todas",periodo:"30",orden:"buzz",q:"",vista:"todo",conectado:false,db:null,dl:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
function hace(iso){
  if(!iso)return"";const t=Date.parse(iso);if(isNaN(t))return"";
  const m=Math.round((Date.now()-t)/60000);
  if(m<1)return"ahora";if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<24)return`hace ${h} h`;
  const d=Math.round(h/24);if(d<30)return`hace ${d} d`;return new Date(t).toLocaleDateString("es-ES",{day:"numeric",month:"short"});
}
const colorBuzz=b=>b>=80?"var(--alto)":b>=60?"var(--aviso)":"var(--vieira)";
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- Métricas ---------- */
const fmt=n=>{if(n==null||n===""||isNaN(+n))return null;n=+n;const o={maximumFractionDigits:1};return n>=1e6?(n/1e6).toLocaleString("es-ES",o)+" M":n>=1e4?Math.round(n/1e3).toLocaleString("es-ES")+" mil":n.toLocaleString("es-ES")};
const MET=[["vistas","Visualizaciones"],["likes","Me gusta"],["reacciones","Reacciones"],["comentarios","Comentarios"],["compartidos","Compartidos"],["guardados","Guardados"],["seguidores","Seguidores"]];
const interacciones=i=>{const m=i.metricas||{};return["likes","reacciones","comentarios","compartidos","guardados"].reduce((t,k)=>t+(+m[k]||0),0)};
const vistas=i=>+((i.metricas||{}).vistas)||0;
function engagement(i){const v=vistas(i),t=interacciones(i);return v>0&&t>0?t/v*100:null}
const porGanador=(a,b)=>(interacciones(b)>0)-(interacciones(a)>0)||interacciones(b)-interacciones(a)||vistas(b)-vistas(a);
function metricasHtml(i){
  const m=i.metricas||{};
  const cel=MET.filter(([k])=>fmt(m[k])).map(([k,l])=>`<div class="met"><b>${fmt(m[k])}</b><span>${l}</span></div>`);
  const e=engagement(i);if(e!=null)cel.push(`<div class="met eng"><b>${e.toLocaleString("es-ES",{maximumFractionDigits:1})} %</b><span>Engagement</span></div>`);
  if(!cel.length)return"";
  return`<div class="metricas">${cel.join("")}</div><div class="met-fuente">Métricas${m.aprox?" aproximadas":""}${m.fuente?": "+esc(m.fuente):""}${m.medido?" · medidas "+esc(hace(m.medido)):""}</div>`;
}
function podio(items){
  const g=items.filter(i=>interacciones(i)>0||vistas(i)>0).sort(porGanador).slice(0,3);
  if(!g.length)return`<div class="vacio"><b>Aún no hay interacciones medidas</b>En cada barrida el equipo apunta visualizaciones, me gusta, comentarios y compartidos de los posts ganadores.</div>`;
  return`<div class="podio">${g.map((i,k)=>{const p=PLAT[i.plataforma]||{n:i.plataforma,c:"#55617a"};const t=interacciones(i);const m=i.metricas||{};
    const desg=MET.filter(([key])=>fmt(m[key])).map(([key,l])=>`${fmt(m[key])} ${l.toLowerCase()}`).join(" · ");
    return`<div class="ganador"><div class="pos"><span>#${k+1}</span><span class="plat" style="background:${p.c}">${esc(p.n)}</span></div>
      <div class="total">${t>0?fmt(t):fmt(vistas(i))}<small>${t>0?"interacciones":"visualizaciones"}</small></div>
      <a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">${esc(i.titulo)}</a><div class="desg">${esc(desg)}</div></div>`}).join("")}</div>`;
}

const mundo={gente:[],raf:0,ult:0,prox:0,cont:null,bocas:[]};
function corr(pt){return pt.y<=70?62:pt.y<=170?160:268}
function ruta(f,t){const c0=corr(f),c1=corr(t),r=[{x:f.x,y:c0}];
  if(c0!==c1){const mid=(f.x+t.x)/2;const ax=PASILLOS.reduce((b,v)=>Math.abs(v-mid)<Math.abs(b-mid)?v:b);r.push({x:ax,y:c0},{x:ax,y:c1})}
  r.push({x:t.x,y:c1},{x:t.x,y:t.y});return r}
function fraseReal(p){
  if(p.a.id==="jefa"){const top=st.items.filter(i=>!i.descartado).sort((a,b)=>(b.buzz||0)-(a.buzz||0))[0];return top?`Lo más fuerte ahora: «${corta(top.titulo,70)}»`:azar(FRASES.jefa)}
  const mio=st.items.filter(i=>i.agente===p.a.n&&!i.descartado).sort((a,b)=>Date.parse(b.detectado)-Date.parse(a.detectado));
  if(mio.length){const i=azar(mio.slice(0,4));const t=interacciones(i);return`Mirad esto${t?` (${fmt(t)} interacciones)`:""}: «${corta(i.titulo,64)}»`}
  return azar(FRASES[p.a.id]);
}
function fraseMesa(p){const b=(st.estado?.bitacora||[]).filter(x=>x.quien===p.a.n);return b.length&&Math.random()<.45?corta(b[0].texto,110):azar(FRASES[p.a.id])}
function bocadillo(p,texto,ms){
  if(!mundo.cont)return;if(mundo.bocas.length>=2)mundo.bocas.shift().remove();
  const el=document.createElement("div");el.className="bocadillo"+(p.y<120?" abajo":"");
  el.innerHTML=`<b>${esc(p.a.n)}</b>${esc(texto)}`;
  el.style.left=Math.min(84,Math.max(16,p.x/6))+"%";el.style.top=(p.y/3)+"%";
  mundo.cont.appendChild(el);mundo.bocas.push(el);
  setTimeout(()=>{el.remove();mundo.bocas=mundo.bocas.filter(x=>x!==el)},ms);
}
function iniciarMundo(){
  pararMundo();mundo.cont=$("#plano-radar");if(!mundo.cont)return;
  mundo.gente=EQUIPO.map((a,i)=>{const[x,y]=PUESTOS[a.id];const seat={x,y:y+34};const el=document.getElementById("p-"+a.id);
    return{a,i,seat,x:seat.x,y:seat.y,ang:0,r:[],estado:"sentado",hasta:0,el,rot:el.querySelector(".rot")}});
  mundo.prox=performance.now()+1200;mundo.ult=performance.now();
  const tick=ts=>{const dt=Math.min(.05,(ts-mundo.ult)/1000);mundo.ult=ts;
    if(ts>mundo.prox){mundo.prox=ts+3200+Math.random()*4200;planificar(ts)}
    for(const p of mundo.gente){
      if(p.r.length){const t=p.r[0],dx=t.x-p.x,dy=t.y-p.y,dist=Math.hypot(dx,dy),v=75*dt;
        if(dist<=v||quieto){p.x=t.x;p.y=t.y;p.r.shift()}else{p.x+=dx/dist*v;p.y+=dy/dist*v;p.ang=Math.atan2(dy,dx)*180/Math.PI+90}
        if(!p.r.length){if(p.estado==="ida"){p.estado="visita";p.hasta=ts+3800+Math.random()*2400;p.ang=p.mira??0;bocadillo(p,p.frase,p.hasta-ts)}
          else if(p.estado==="vuelta"){p.estado="sentado";p.ang=0}}}
      else if(p.estado==="visita"&&ts>p.hasta){p.estado="vuelta";p.r=ruta(p,p.seat)}
      const bob=p.estado==="sentado"&&!quieto?Math.sin(ts/260+p.i*1.7)*.9:0;
      p.el.setAttribute("transform",`translate(${p.x.toFixed(1)} ${(p.y+bob).toFixed(1)})`);p.rot.setAttribute("transform",`rotate(${p.ang.toFixed(0)})`);
    }
    mundo.raf=requestAnimationFrame(tick)};
  mundo.raf=requestAnimationFrame(tick);
}
function planificar(ts){
  const libres=mundo.gente.filter(p=>p.estado==="sentado");if(!libres.length)return;
  const p=azar(libres),r=Math.random();
  if(r<.38){p.estado="ida";p.mira=0;p.frase=fraseReal(p);p.r=ruta(p,{x:250+Math.random()*100,y:64})}
  else if(r<.62){const q=azar(mundo.gente.filter(x=>x!==p));p.estado="ida";const lado=q.seat.x>500?-27:27;p.mira=lado>0?-90:90;
    p.frase=q.a.id==="jefa"?`Marta, ¿cuánto buzz le damos a esto?`:p.a.id==="jefa"?`${q.a.n}, ¿esto está verificado?`:`${q.a.n}, ¿has visto lo que está pasando con esto?`;
    p.r=ruta(p,{x:q.seat.x+lado,y:q.seat.y})}
  else if(r<.76){p.estado="ida";p.mira=-90;p.frase=azar(["Pausa de café","Cinco minutos y sigo","¿Alguien quiere café?"]);p.r=ruta(p,{x:70,y:262})}
  else bocadillo(p,fraseMesa(p),4200);
}
function pararMundo(){cancelAnimationFrame(mundo.raf);mundo.raf=0;mundo.bocas.forEach(b=>b.remove());mundo.bocas=[];mundo.cont=null}

function actualizarEdificio(){

function irA(id){st.sala=id;try{history.replaceState(null,"",id?"#"+id:location.pathname)}catch(_){}pintar();window.scrollTo(0,0)}
document.addEventListener("click",e=>{
  if(e.target.closest("#irEdificio,[data-volver]")){irA(null);return}
  const c=e.target.closest(".sala-card[data-sala]");if(c)irA(c.dataset.sala);
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches?.(".sala-card")){e.preventDefault();irA(e.target.dataset.sala)}});

function filtrados(){
  const lim=st.periodo==="todo"?Infinity:+st.periodo*864e5;const q=st.q.trim().toLowerCase();
  let r=st.items.filter(i=>{
    if(st.vista==="guardados"&&!i.guardado)return false;
    if(st.vista!=="descartados"&&i.descartado)return false;
    if(st.vista==="descartados"&&!i.descartado)return false;
    if(st.plat!=="todas"&&i.plataforma!==st.plat)return false;
    const f=Date.parse(i.publicado||i.detectado);if(!isNaN(f)&&Date.now()-f>lim)return false;
    if(q&&!`${i.titulo} ${i.resumen} ${i.fuente} ${(i.etiquetas||[]).join(" ")}`.toLowerCase().includes(q))return false;
    return true});
  r.sort(st.orden==="buzz"?(a,b)=>(b.buzz||0)-(a.buzz||0):st.orden==="interacciones"?porGanador:(a,b)=>Date.parse(b.detectado||0)-Date.parse(a.detectado||0));
  return r;
}

  if(!st.sala){if(!$("#plano-radar"))pintarEdificio();actualizarEdificio();return}
  pararMundo();
  const s=SALAS.find(x=>x.id===st.sala);

}

    <h3>Equipo de la sala <span class="c">${EQUIPO.length} especialistas</span></h3>
    <div class="equipo">${EQUIPO.map(a=>{const ac=(e.agentes||{})[a.id]||{};return`<div class="agente">
      <div class="avatar" style="background:${a.c}">${esc(a.n.slice(0,2).toUpperCase())}</div>
      <div class="nom">${esc(a.n)}</div><div class="rol">${esc(a.rol)}</div>
      <div class="act">${ac.ultima?`<span>${esc(hace(ac.ultima))}</span>·<span>${ac.hallazgos??0} nuevos</span>`:'<span>Esperando primera barrida</span>'}</div></div>`}).join("")}</div>
  </section>

  <div class="filtros" role="group" aria-label="Filtros">
    <div class="chips">
      <button class="chip" data-plat="todas" aria-pressed="${st.plat==='todas'}">Todas <span class="cnt">${items.length}</span></button>
      ${Object.keys(PLAT).filter(p=>porPlat[p]).map(p=>`<button class="chip" data-plat="${p}" aria-pressed="${st.plat===p}">${PLAT[p].n} <span class="cnt">${porPlat[p]}</span></button>`).join("")}
    </div>
    <input class="buscar" id="q" type="search" placeholder="Buscar: Muxía, albergue, Primitivo…" value="${esc(st.q)}" aria-label="Buscar">
    <select id="periodo" aria-label="Periodo"><option value="1">24 horas</option><option value="7">7 días</option><option value="30">30 días</option><option value="todo">Todo</option></select>
    <select id="orden" aria-label="Orden"><option value="buzz">Más buzz</option><option value="interacciones">Más interacciones</option><option value="recientes">Más recientes</option></select>
    <select id="vista" aria-label="Vista"><option value="todo">Todo</option><option value="guardados">Guardados</option><option value="descartados">Descartados</option></select>
    <button class="btn prim" id="exportar">Exportar CSV</button>
  </div>

  <div class="dos">
    <ul class="lista" aria-live="polite">${lista.length?lista.map(fila).join(""):vacio()}</ul>
    <aside class="bitacora" aria-label="Bitácora">
      <div class="bloque"><h3>Bitácora del equipo</h3></div>
      <ol>${(e.bitacora||[]).slice(0,30).map(b=>`<li><time>${esc(hace(b.t))} · ${esc(b.quien||"")}</time><span>${esc(b.texto)}</span></li>`).join("")||'<li><span>Aquí verás qué hace cada especialista en cada barrida.</span></li>'}</ol>
    </aside>
  </div>`;
  $("#periodo").value=st.periodo;$("#orden").value=st.orden;$("#vista").value=st.vista;
  if(foco==="q"){const q=$("#q");q.focus();try{q.setSelectionRange(selS,selS)}catch(_){}}
}

function fila(i){
  const p=PLAT[i.plataforma]||{n:i.plataforma||"Web",c:"#55617a"};
  const nuevo=Date.now()-Date.parse(i.detectado)<6*36e5;
  return`<li class="item${nuevo?' nuevo':''}" data-id="${esc(i.id)}">
    <div class="buzz" title="Índice de buzz 0-100"><div class="num">${i.buzz??"–"}</div><div class="barra"><i style="height:${Math.max(4,Math.min(100,i.buzz||0))}%;background:${colorBuzz(i.buzz||0)}"></i></div><small>buzz</small></div>
    <div style="min-width:0">
      <div class="meta"><span class="plat" style="background:${p.c}">${esc(p.n)}</span>${nuevo?'<span class="pill">Nuevo</span>':''}<span>${esc(i.fuente||"")}</span><span>· publicado ${esc(hace(i.publicado)||"s/f")}</span><span>· por ${esc(i.agente||"el equipo")}</span></div>
      <h4><a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">${esc(i.titulo)}</a></h4>
      <p>${esc(i.resumen)}</p>
      ${i.porque?`<div class="porque">${esc(i.porque)}</div>`:''}
      ${metricasHtml(i)}
      ${i.senales?`<div class="senales">${esc(i.senales)}</div>`:''}
      ${(i.etiquetas||[]).length?`<div class="tags">${i.etiquetas.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>`:''}
      <div class="acciones">
        <button class="btn" data-acc="guardar" aria-pressed="${!!i.guardado}">${i.guardado?'Guardado':'Guardar'}</button>
        <button class="btn" data-acc="copiar">Copiar ficha</button>
        <button class="btn" data-acc="descartar" aria-pressed="${!!i.descartado}">${i.descartado?'Recuperar':'Descartar'}</button>
      </div>
    </div></li>`;
}
function vacio(){
  if(!st.items.length)return`<li class="vacio"><b>${st.conectado?'El equipo está en su primera barrida':'Conectando con la sala'}</b>Cuando los especialistas terminen de rastrear Instagram, TikTok, YouTube, Facebook, prensa y blogs, los hallazgos aparecerán aquí ordenados por buzz.</li>`;
  return`<li class="vacio"><b>Nada con estos filtros</b>Prueba con otro periodo o plataforma.</li>`;
}

document.addEventListener("click",async e=>{
  const c=e.target.closest("[data-plat]");if(c){st.plat=c.dataset.plat;pintar();return}
  if(e.target.id==="exportar"){exportar();return}
  const a=e.target.closest("[data-acc]");if(!a)return;
  const id=a.closest("[data-id]").dataset.id;const it=st.items.find(x=>x.id===id);if(!it)return;
  if(a.dataset.acc==="copiar"){
    const t=`${it.titulo}\n${it.url}\n${PLAT[it.plataforma]?.n||it.plataforma} · ${it.fuente} · buzz ${it.buzz}\n${it.resumen}${it.porque?"\nPor qué funciona: "+it.porque:""}${it.senales?"\nSeñales: "+it.senales:""}${MET.filter(([k])=>fmt((it.metricas||{})[k])).map(([k,l])=>"\n"+l+": "+fmt(it.metricas[k])).join("")}`;
    try{await navigator.clipboard.writeText(t);toast("Ficha copiada")}catch(_){toast("No se pudo copiar en este visor")}
    return}
  if(!st.db){toast("Sin conexión con la sala");return}
  const campo=a.dataset.acc==="guardar"?"guardado":"descartado";
  try{await st.db.doc("radar/"+id).update({[campo]:!it[campo]});toast(campo==="guardado"?(it[campo]?"Quitado de guardados":"Guardado"):(it[campo]?"Recuperado":"Descartado"))}
  catch(err){toast("Solo el propietario puede marcar contenidos")}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;clearTimeout(pintar.t);pintar.t=setTimeout(pintar,180)}});
document.addEventListener("change",e=>{if(["periodo","orden","vista"].includes(e.target.id)){st[e.target.id]=e.target.value;pintar()}});

async function exportar(){
  const rows=filtrados();const cols=["buzz","plataforma","titulo","url","fuente","publicado","detectado","vistas","likes","reacciones","comentarios","compartidos","guardados","seguidores","interacciones","resumen","porque","senales","etiquetas","agente"];
  const q=v=>`"${String(Array.isArray(v)?v.join(" "):v??"").replace(/"/g,'""')}"`;
  const csv="﻿"+[cols.join(";"),...rows.map(r=>cols.map(c=>q(c==="interacciones"?(interacciones(r)||""):MET.some(([k])=>k===c)?(r.metricas||{})[c]:r[c])).join(";"))].join("\n");
  if(!st.dl){toast("La descarga no está disponible en este visor");return}
  try{await st.dl.save({filename:`radar-viral-camino-${new Date().toISOString().slice(0,10)}.csv`,data:csv})}catch(err){if(err?.code!=="declined")toast("No se pudo exportar")}
}

if(location.hash&&SALAS.some(s=>"#"+s.id===location.hash))st.sala=location.hash.slice(1);
pintar();
setInterval(()=>{if(document.activeElement?.id!=="q")pintar()},60000);

(async()=>{
  const db=await window.claude?.use?.("db");
  st.dl=await window.claude?.use?.("downloads");
  if(!db){$("#pieEstado").textContent="Abre esta página desde claude.ai para verla en vivo.";pintar();return}
  st.db=db;
  db.collection("radar").orderBy("detectado","desc").limit(600).onSnapshot(s=>{
    st.conectado=true;st.items=s.docs.map(d=>({id:d.id,...d.data()}));
    $("#pieEstado").innerHTML=`<span class="vivo">En directo</span><span>${st.items.filter(i=>!i.descartado).length} contenidos en el radar</span>`;
    if(document.activeElement?.id!=="q")pintar();
  },()=>{st.conectado=false;pintar()});
  db.doc("estado/radar").onSnapshot(s=>{st.estado=s.exists?s.data():null;if(document.activeElement?.id!=="q")pintar()});
})();
</script>
